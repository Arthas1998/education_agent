course:
  id: "70_Smile"  # 课程唯一ID（常量）

paths:
  base_dir: "D:\\data\\PythonProject\\HITProject\\education_agent\\prompt\\src"
#  base_dir: "D:\\data\\project\\education_agent\\prompt\\src"                       # 资源根目录
#  base_dir: "prompt/src"                       # 资源根目录
  template_dir: "{paths.base_dir}/template"       # 模板目录（必须写 {paths.base_dir}，不允许 {base_dir}）
  plan_dir: "{paths.base_dir}/lesson_plans"       # 教案目录
  textbook_dir: "{paths.base_dir}/textbook"       # 教材目录

registry:
  system_template:
    type: text
    from: { kind: file, path: "{paths.template_dir}/gen_sys_img.txt", encoding: "utf-8" }  # system模板文本

  user_template:
    type: text
    from: { kind: file, path: "{paths.template_dir}/gen_user_img.txt", encoding: "utf-8" } # user模板文本

  lesson_plan:
    type: yaml_object
    from: { kind: file, path: "{paths.plan_dir}/{course.id}.yaml", encoding: "utf-8" }  # 整份教案YAML

  textbook_pdf:
    type: pdf
    from: { kind: file, path: "{paths.textbook_dir}/{course.id}.pdf" }                  # 整本教材PDF

  textbook_yaml:
    type: yaml_object
    from: { kind: file, path: "{paths.textbook_dir}/{course.id}.yaml", encoding: "utf-8" }  # 整本教材YAML

  student_answer:
    type: text
    default: ""
    from: { kind: runtime, key: student_answer }                       # 外部 runtime_vars.student_answer

  memory_text:
    type: text
    default: ""
    from: { kind: memory, key: memory_text }

  prev_summary:
    type: text
    default: ""
    from: { kind: file, path: "{paths.base_dir}/no_summary_E.txt", encoding: "utf-8" }                                          # 外部 runtime_vars.step_ids

templates:
  generator:
    system:
      role: "system"
      content:
        kind: "txt_template"
        ref: "system_template"
      slots:
        prev_summary:
          ref: "prev_summary"

    user:
      role: "user"
      content:
        kind: "parts"
        parts:
          - type: "text"
            text:
              kind: "txt_template"
              ref: "user_template"
      slots:
        student_answer:
          ref: "student_answer"

        previous_plan:
          select:
            kind: yaml_by_id_text
            from: lesson_plan
            list_path: "steps"
            match:
              field: "id"
              input_param: "previous_steps_ids"
            take:
              field: "plan_nl"
            join:
              sep: "\n"

        plan:
          select:
            kind: yaml_by_id_text
            from: lesson_plan
            list_path: "steps"
            match:
              field: "id"
              input_param: "step_ids"   # 外部 params.step_ids: "greet" 或 ["greet","review"]
            take:
              field: "plan_nl"          # 你可改字段名，这里只要对齐教案YAML即可
            join:
              sep: "\n"
#            render_with_refs: [prev_summary]

        textbook_description:
          select:
            kind: yaml_by_id_text
            from: textbook_yaml
            list_path: "pages"
            match:
              field: "page"
              input_param: "pages"   # 外部 params.step_ids: "greet" 或 ["greet","review"]
            take:
              field: "description"            # 你可改字段名，这里只要对齐教案YAML即可
            join:
              sep: "\n"

        material_pdf:
          select:
            kind: pdf_pages
            from: textbook_pdf
            pages_param: "pdf_pages"    # 外部 params.pdf_pages: 3 / [3,4] / "3-4"
            output:
              as: openai_image_url_parts
              dpi: 50
              image_format: "jpeg"
            placeholder_text: ""        # 模板 {material_pdf} 替换为空串，但会追加图片parts

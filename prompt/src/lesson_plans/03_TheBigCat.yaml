# ============================
# Lesson Plan: RAZ/A/TheBigCat
# ============================
steps:
  - id: "1"
    title: greet_1
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then asks the student: "What do you do in the morning before school?"
  - id: "2"
    title: greet_1
    pages: []
    plan_nl: |
      Wait for the student's answer and encourage the student to mention specific morning activities.
  - id: "3"
    title: greet_2
    pages: []
    plan_nl: |
      The teacher should respond to the student's answer to the previous question at first.
      Then ask: "What color do you like best?"
  - id: "4"
    title: greet_2
    pages: []
    plan_nl: |
      Just talk with student. It doesn't need to be related to the textbook content.
  - id: "5"
    title: cover
    pages: [1]
    plan_nl: |
      Clearly guide the student to turn to page 1: "Turn to page 1."
      Ask one prediction question: "What do you think the big cat will do in this story?"
      Wait and encourage; do not correct the guess.
  - id: "6"
    title: cover
    pages: []
    plan_nl: |
      Encourage briefly and transition: "Let's find out in the story. OK?"
  - id: "7"
    title: page_3
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      Ask: "Can you read this sentence: 'The big cat plays.'"
      Wait, correct only if misread, and encourage.
  - id: "8"
    title: page_3
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response, correct mistakes and offer encouragement.
  - id: "9"
    title: page_3
    pages: []
    plan_nl: |
      Ask a divergent question about playing.

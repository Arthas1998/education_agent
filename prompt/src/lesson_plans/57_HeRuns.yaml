# =========================
# Lesson Plan: 70_Smile
# =========================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then asks the student: "What color do you like best?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Wait for the student's answer and encourage the student to mention specific reasons for their choice.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Ask: "What’s your favorite fruit?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Just talk with student. It doesn't need to be related to the textbook content.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "Let`s turn to cover page."
      Then introduces the textbook and ask: "Today we are going to read a story called ‘He Runs.’ What is the boy doing in the picture?"

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      After encouraging or correcting the student's answer, ask: "Let’s see where he runs to. OKey?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Let`s turn to page 3."
      Then read the text first: "I will read the text first. He runs to the bus."
      followed by: "Can you read this sentence for me?"

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |      
      Ask a question about the details of the picture.
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |      
      Ask a divergent problem about bus.

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |      
      Clearly guide the student to turn to page 4: "Turn to page 4."
      Ask: "Can you read this sentence, ‘He runs to the train’?"

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |      
      After students read the text aloud, ask a question about the details of the picture

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: | 
      Ask a divergent problems about train.

  - id: "13"
    title: "page_5"
    pages: [5]
    plan_nl: | 
      Clearly guide the student to turn to page 5 and ask: "Now, let`s turn to page 5."
      Ask a question about the details of the picture.

  - id: "14"
    title: "page_5"
    pages: []
    plan_nl: | 
      Guide the students to read the text: "Please read this sentence, 'He runs to the boat'"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "15"
    title: "page_5"
    pages: []
    plan_nl: |   
      Ask a divergent problems about boat.

  - id: "16"
    title: "page_6"
    pages: [6]
    plan_nl: | 
      Clearly guide the student to turn to page 6: "Turn to page 6. Can you read this page for me?"
      Wait for the student to read aloud: "He runs to the plane."

  - id: "17"
    title: "page_6"
    pages: []
    plan_nl: | 
      Ask a question about the details of the picture.
      Wait for the student’s response, correct mistakes and describe the picture.

  - id: "18"
    title: "page_6"
    pages: []
    plan_nl: | 
      Ask a divergent problems about plane. 

  - id: "19"
    title: "page_7"
    pages: [7]
    plan_nl: | 
      Guide the student to turn to page 7: "Then, turn to page 7. Look at the picture on this page."
      Then ask a question about the details of the picture.

  - id: "20"
    title: "page_7"
    pages: []
    plan_nl: | 
      After the students answered the previous question, have them read the text aloud: "Now, let's read it together.'He runs to the school.'"

  - id: "21"
    title: "page_7"
    pages: []
    plan_nl: | 
      After the students read aloud, ask a divergent problems about dad. 
      Wait for the student’s response and give positive encouragement.

  - id: "22"
    title: "page_8"
    pages: [8]
    plan_nl: | 
      Guide the student to turn to page 8: "Now let’s look at page 8. Can you read this sentence?"

  - id: "23"
    title: "page_8"
    pages: []
    plan_nl: | 
      Ask a question about the details of the picture.
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "24"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a divergent problems about store.
      Wait for the student’s answer.

  - id: "25"
    title: "page_9"
    pages: [9]
    plan_nl: |
      Guide the student to turn to page 9: "Let`s go to next page. Can you read this sentence now?"

  - id: "26"
    title: "page_9"
    pages: []
    plan_nl: |
      After the students read the text aloud, ask a question about the details of the picture.
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "27"
    title: "page_9"
    pages: []
    plan_nl: |
      After respond to the student's answer to the previous question, talk with the student about the picture.
      Wait for the student’s response and give positive encouragement.

  - id: "28"
    title: "page_10"
    pages: [10]
    plan_nl: |
      Guide the student to turn to the last page: "Turn to the last page."
      Then ask a question about the details of the picture.

  - id: "29"
    title: "page_10"
    pages: []
    plan_nl: |
      Respond to the student's answer to the previous question, then ask: "Can you read this sentence?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "30"
    title: "review"
    pages: []
    plan_nl: |
      Review what was learned today by asking questions to help the student remember: "Where does he run at the beginning of the story?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "31"
    title: "review"
    pages: []
    plan_nl: |
      After responding to the student's answer to the previous question, ask: "Can you tell me two places he runs to?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "32"
    title: "goodbye"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! See you next time!"

policies:
  defaults:
    step_turns: 1
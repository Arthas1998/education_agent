    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Now, let`s turn to page 4."
      The teacher reads the text first: "Read aloud with me. The baseball coach asks Carlos to join his team. "I'm so new in this school."

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      After reading the first two sentences, then the teacher reads the text: "Go on reading. I don't know the kids here," says Carlos."
      Wait for the student's response and correct mistakes.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |

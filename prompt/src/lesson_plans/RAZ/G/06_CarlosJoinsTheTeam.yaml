steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What did you eat for lunch?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Have you ever been to a zoo?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat only.
      Transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "Carlos Joins the Team." We will read how Carlos makes a choice and learns about being part of a team."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      The teacher reads the text first: "Read aloud with me. Carlos likes to play baseball. He plays catch with his little sister, Selena."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.
      Wait for the student's response and correct mistakes.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student's response and correct mistakes.

  - id: "10"

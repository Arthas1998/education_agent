steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "How was your day at school?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Have you ever seen a frog or a fish?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat only, then transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "Animal Eyes." We will learn how different animals use their eyes to see."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_2"
    pages: [2]
    plan_nl: |
      Clearly guide the student to turn to page 2: "Now, let`s turn to page 2."
      The teacher reads the text first: "I will read first. ANIMAL EYES Written by Pam Bull www.readinga-z.com"

  - id: "8"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.

  - id: "9"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.


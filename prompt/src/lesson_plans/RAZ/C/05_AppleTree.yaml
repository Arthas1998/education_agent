# ============================
# Lesson Plan: RAZ/C/05_AppleTree
# ============================
steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What did you eat for lunch?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "What is your favorite game to play?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat.
      Keep the greeting simple.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called 'Apple Tree.' We will learn the life cycle of an apple using order words."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      The teacher reads the text first: "Read aloud with me. An apple grows in a cycle. How does the cycle go?"

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase from the text.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Now, let`s turn to page 4."
      The teacher reads the text first: "Read aloud with me. First comes the seed."

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about sequence (what happens first/next).
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "13"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Turn to page 5."
      Guide the students to read the text: "Please read this text. Then comes the sprout."

  - id: "14"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question to focus on specific elements or actions mentioned in the page.
      Wait for the student’s response and correct mistakes.


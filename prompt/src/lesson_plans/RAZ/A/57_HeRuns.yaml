# ============================
# Lesson Plan: RAZ/E/06_HeRuns
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "How was your day at school?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "What makes you happy today?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat only, then transition to the book.
      Keep it warm and short.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about what the boy will do in the story.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Encourage the student’s guess and say: "Let’s find out in the story. OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      Ask the student to read the sentence: "He runs to the bus."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "What color is the bus?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a divergent question about riding a bus.

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4."
      Ask the student to read the sentence: "He runs to the train."

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "Is the train big or small?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a divergent question about taking a train.

  - id: "13"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Turn to page 5."
      Ask the student to read the sentence: "He runs to the boat."

  - id: "14"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "What do you see in the water?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "15"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a divergent question about going on a boat.

  - id: "16"
    title: "page_6"
    pages: [6]
    plan_nl: |
      Clearly guide the student to turn to page 6: "Turn to page 6."
      Ask the student to read the sentence: "He runs to the plane."

  - id: "17"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "Where is the plane?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "18"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a divergent question about flying on a plane.

  - id: "19"
    title: "page_7"
    pages: [7]
    plan_nl: |
      Clearly guide the student to turn to page 7: "Turn to page 7."
      Ask the student to read the sentence: "He runs to the school."

  - id: "20"
    title: "page_7"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "What building do you see?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "21"
    title: "page_7"
    pages: []
    plan_nl: |
      Ask a divergent question about how you go to school.

  - id: "22"
    title: "page_8"
    pages: [8]
    plan_nl: |
      Clearly guide the student to turn to page 8: "Turn to page 8."
      Ask the student to read the sentence: "He runs to the store."

  - id: "23"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "What is in the store window?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "24"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a divergent question about what you like to buy at a store.

  - id: "25"
    title: "page_9"
    pages: [9]
    plan_nl: |
      Clearly guide the student to turn to page 9: "Turn to page 9."
      Ask the student to read the sentence: "He runs to the pool."

  - id: "26"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "What is around the pool?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "27"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a divergent question about swimming in a pool.

  - id: "28"
    title: "page_10"
    pages: [10]
    plan_nl: |
      Clearly guide the student to turn to page 10: "Turn to page 10."
      Ask the student to read the sentence: "He runs home."

  - id: "29"
    title: "page_10"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture: "What do you see near the house?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "30"
    title: "page_10"
    pages: []
    plan_nl: |
      Ask a divergent question about what you like to do at home.

  - id: "31"
    title: "review"
    pages: []
    plan_nl: |
      Ask one recall question: "Where does he run? Tell me one place from the story."
      Wait for the response, correct gently if needed, and encourage.

  - id: "32"
    title: "review"
    pages: []
    plan_nl: |
      Ask one short wrap-up vocab question: "Can you say the word 'runs' and one place (bus/train/boat)?"
      Offer quick praise and a gentle correction only if needed.

  - id: "33"
    title: "goodbye"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! You smiled with every page! See you next time!"

policies:
  defaults:
    step_turns: 1

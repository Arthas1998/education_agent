# ============================
# Lesson Plan: RAZ/A/03_TheBigCat
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What animal do you like best?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Ask at most ONE short follow-up, then move on.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Do you have a pet? What is it?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat and transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Encourage the student's guess and say: "Nice idea! Let's find out in the story. OK?"
      Introduce the book title: "Today we will read 'The Big Cat.'"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      Ask the student to read: "The big cat plays."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a divergent question about playing with a pet.

  - id: "10"
    title: "page_4"

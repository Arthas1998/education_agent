  - id: "32"
    title: "review"
    pages: []
    plan_nl: |
      Ask the student to choose one sentence to read again (e.g., runs or sleeps) and praise.
      Give one gentle suggestion only if the reading is unclear.

  - id: "33"
    title: "goodbye"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! You smiled with every page! See you next time!"


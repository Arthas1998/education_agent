# ============================
# Lesson Plan: RAZ/E/03_WhichTree
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "How are you today?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "What is your favorite tree or plant?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat and transition to cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called ‘Which Tree?’ We will learn about different trees and their leaves."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      The teacher reads the text first: "I will read first. You can tell trees by their leaves."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the main point of the text.

  - id: "9"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Now, let’s turn to page 4."
      Ask the student to read the text: "Can you read this text?"

  - id: "10"
    title: "page_4"
    pages: []
    plan_nl: |
      Wait for the student’s response and correct mistakes.

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.

  - id: "12"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Now, let’s turn to page 5."
      The teacher reads the text first: "I will read first. See these leaves? Their tree can be hollow inside."

  - id: "13"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question about cause and effect in the text.

  - id: "14"
    title: "page_6"
    pages: [6]

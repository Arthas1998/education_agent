steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What is something fun you learned this week?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Do you like being outside in nature?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat.
      Transition to the book cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called 'Arctic Animals'. We will learn about animals that live in the Arctic and what they do there."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      The teacher reads the text first: "Some animals live in cold places. The Arctic is one of the coldest places on Earth."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase from the text.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_3"
    pages: []

# ============================
# Lesson Plan: RAZ/B/02_ThePetRats
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What animal do you like best?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Wait for the student's answer and encourage the student to talk about animals more.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      The teacher responds to the student's answer.
      Then ask: "Do you have any pets at home?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Just chat with the student. It doesn't need to be related to the textbook content.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Then ask: "What do you think the rats in the picture are doing?"

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a story called 'The Pet Rats.' It's about some fun pet rats."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Now, let`s turn to page 3."
      The teacher reads the text first: "The pet rats sleep."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a divergent question about how pets sleep at home.

  - id: "10"
    title: "page_4"

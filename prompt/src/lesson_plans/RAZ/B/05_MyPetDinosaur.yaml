  - id: "31"
    title: "review"
    pages: [11]
    plan_nl: |
      Review the story by asking one quick recall question about one thing the pet dinosaur can do.
      Wait for the student’s response and correct mistakes.

  - id: "32"
    title: "review_retell"
    pages: []
    plan_nl: |
      Ask the student to retell what the pet dinosaur can and cannot do using simple action words.

  - id: "33"
    title: "goodbye"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! You smiled with every page! See you next time!"

policies:

# ============================
# Lesson Plan: RAZ/B/05_MyPetDinosaur
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then asks the student: "What is your favorite subject at school?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Wait for the student's answer and encourage the student to say one more thing they like about that subject.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      The teacher should respond to the student's answer to the previous question at first.
      Then ask: "What animal do you like best?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Just talk with student. It doesn't need to be related to the textbook content.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Then ask one prediction question about what the pet dinosaur will do.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a story called 'My Pet Dinosaur.' It's about a pet dinosaur and the things it can do."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Now, let`s turn to page 3."
      The teacher reads the text first: "My pet dinosaur can fetch."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a divergent question about what you would want a pet to fetch in real life.

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4."
      The teacher reads the text first: "My pet dinosaur can sit."

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a divergent question about when we sit down in everyday life.

  - id: "13"
    title: "page_5"
    pages: [5]

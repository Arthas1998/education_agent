# ============================
# Lesson Plan: RAZ/B/06_OnTheFarm
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then asks the student: "What did you eat for lunch?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Wait for the student's answer and encourage the student to name one more food or drink.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      The teacher should respond to the student's answer to the previous question at first.
      Then ask: "Have you ever been to a zoo?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Just talk with student. It doesn't need to be related to the textbook content.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Then ask one prediction question about what animals you might see on this farm.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a story called 'On the Farm.' It's about farm animals and where they are on a farm."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Now, let`s turn to page 3."
      The teacher reads the text first: "A dog is in a house."

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a divergent question about why a dog might like being in a house.

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4."
      The teacher reads the text first: "A cow is in a barn."

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a divergent question about what a barn is used for on a farm.

  - id: "13"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Now, let`s turn to page 5."
      The teacher reads the text first: "A pig is in the mud."

  - id: "14"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "15"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a divergent question about why animals might like mud.

  - id: "16"
    title: "page_6"
    pages: [6]
    plan_nl: |
      Clearly guide the student to turn to page 6: "Turn to page 6."
      The teacher reads the text first: "A chicken is in the hay."

  - id: "17"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "18"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a divergent question about what hay is and what animals use it for.

  - id: "19"
    title: "page_7"
    pages: [7]
    plan_nl: |
      Clearly guide the student to turn to page 7: "Now, let`s turn to page 7."
      Ask the student to read the text: "Can you read this text?"

  - id: "20"
    title: "page_7"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "21"
    title: "page_7"
    pages: []
    plan_nl: |
      Ask a divergent question about what you might see in a field in real life.

  - id: "22"
    title: "page_8"
    pages: [8]
    plan_nl: |
      Clearly guide the student to turn to page 8: "Turn to page 8."
      Ask the student to read the text: "Can you read this text?"

  - id: "23"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "24"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a divergent question about what animals do on a pond.

  - id: "25"
    title: "page_9"
    pages: [9]
    plan_nl: |
      Clearly guide the student to turn to page 9: "Now, let`s turn to page 9."
      Ask the student to read the text: "Can you read this text?"

  - id: "26"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "27"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a divergent question about why animals might like being on a hill.

  - id: "28"
    title: "page_10"
    pages: [10]
    plan_nl: |
      Clearly guide the student to turn to page 10: "Turn to page 10."
      Ask the student to read the text: "Can you read this text?"

  - id: "29"
    title: "page_10"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "30"
    title: "page_10"
    pages: []
    plan_nl: |
      Ask a divergent question about which farm animal you would like to see and why.

  - id: "31"
    title: "review"
    pages: [11]
    plan_nl: |
      Review the story by asking one quick recall question about the order of where the animals are.
      Wait for the student’s response and correct mistakes.

  - id: "32"
    title: "review_retell"
    pages: []
    plan_nl: |
      Ask the student to retell where each animal is using simple place words like in, on, and a.

  - id: "33"
    title: "goodbye"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! You smiled with every page! See you next time!"

policies:
  defaults:
    step_turns: 1

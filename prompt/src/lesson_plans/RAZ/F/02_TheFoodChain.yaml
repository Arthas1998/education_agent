steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What did you do after school today?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Do you like being outside in nature?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat.
      Transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "The Food Chain." We will learn how plants and animals get food in a food chain."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_2"
    pages: [2]
    plan_nl: |
      Clearly guide the student to turn to page 2: "Turn to page 2."
      The teacher reads the text first: "Read aloud with me. The Food Chain. Written by Cheryl Ryan."

  - id: "8"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase from the text.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "10"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Now, let`s turn to page 3."
      The teacher reads the text first: "Read aloud with me. All plants need food in order to live. Green plants make food."

  - id: "11"
    title: "page_3"
    pages: []
    plan_nl: |
      After reading the first two sentences, then the teacher reads the text: "Go on reading. They need air, water, and sunlight to make food. Most plants need soil, too."
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.
      Wait for the student’s response and correct mistakes.

  - id: "13"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "14"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4."
      The teacher reads the text first: "Read aloud with me. All animals need food in order to live. These animals eat plants."

  - id: "15"
    title: "page_4"
    pages: []
    plan_nl: |
      After reading the first two sentences, then the teacher reads the text: "Go on reading. They are called plant eaters."
      Wait for the student’s response and correct mistakes.

  - id: "16"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question to focus on specific elements or actions mentioned in the page.
      Wait for the student’s response and correct mistakes.

  - id: "17"

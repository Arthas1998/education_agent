# ============================
# Lesson Plan: RAZ/F/02_TheFoodChain
# ============================

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "How was your day at school?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Do you like science? Why or why not?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat only, then transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "The Food Chain." We will learn how plants and animals are connected by food."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      I will read first. All plants need food in order to live. Green plants make food.

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Go on reading. They need air, water, and sunlight to make food. Most plants need soil, too.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "10"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "11"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Now, let`s turn to page 4."
      I will read first. All animals need food in order to live. These animals eat plants.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |
      Go on reading. They are called plant eaters.

  - id: "13"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.

  - id: "14"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "15"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Turn to page 5."
      I will read first. These animals eat other animals. They are called meat eaters.

  - id: "16"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.

  - id: "17"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "18"
    title: "page_6"
    pages: [6]
    plan_nl: |
      Clearly guide the student to turn to page 6: "Now, let`s turn to page 6."
      Can you read first two sentences?

  - id: "19"
    title: "page_6"
    pages: []
    plan_nl: |
      Now, can you read the remaining sentences?
      Wait for the student’s response and correct mistakes.

  - id: "20"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question about the main point of the text.

  - id: "21"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question about cause and effect in the text.

  - id: "22"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask ONE light divergent question related to real life.

  - id: "23"
    title: "page_7"
    pages: [7]
    plan_nl: |
      Clearly guide the student to turn to page 7: "Turn to page 7."
      I will read first. A grasshopper eats the leaves of a plant. The grasshopper grows bigger.

  - id: "24"
    title: "page_7"
    pages: []
    plan_nl: |
      Go on reading. A frog eats the grasshopper. The frog grows bigger.

  - id: "25"
    title: "page_7"
    pages: []
    plan_nl: |
      Ask a question about sequence (what happens first/next).

  - id: "26"
    title: "page_7"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "27"
    title: "page_8"
    pages: [8]
    plan_nl: |
      Clearly guide the student to turn to page 8: "Now, let`s turn to page 8."
      Can you read this text?

  - id: "28"
    title: "page_8"
    pages: []
    plan_nl: |
      Wait for the student’s response and correct mistakes.

  - id: "29"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "30"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "31"
    title: "page_9"
    pages: [9]
    plan_nl: |
      Clearly guide the student to turn to page 9: "Turn to page 9."
      I will read first. A small bear catches the fish. The bear eats the fish.

  - id: "32"
    title: "page_9"
    pages: []
    plan_nl: |
      Go on reading. The bear grows bigger.

  - id: "33"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "34"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.

  - id: "35"

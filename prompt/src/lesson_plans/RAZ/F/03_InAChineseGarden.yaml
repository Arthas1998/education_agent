# ============================
# Lesson Plan: RAZ/F/03_InAChineseGarden
# ============================
# Source: :contentReference[oaicite:0]{index=0}

steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What did you eat for lunch?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "What book did you read recently?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat only, then transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "In a Chinese Garden." We will visit a Chinese garden and notice things like a gate, water, rocks, and trees."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      I will read first. I'm visiting a Chinese garden. I enter a gate without doors.

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Now, let`s turn to page 4."
      Can you read first two sentences?

  - id: "11"
    title: "page_4"
    pages: []
    plan_nl: |
      Now, can you read the remaining sentences?
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "13"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "14"
    title: "page_6"
    pages: [6]
    plan_nl: |
      Clearly guide the student to turn to page 6: "Turn to page 6."
      I will read first. I see a huge rock. The rock looks so strong.

  - id: "15"
    title: "page_6"
    pages: []
    plan_nl: |
      Go on reading. It will not move or fall down. I'm glad I'm strong now, too.

  - id: "16"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "17"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase.

  - id: "18"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask ONE light divergent question related to real life.

  - id: "19"
    title: "page_8"
    pages: [8]
    plan_nl: |
      Clearly guide the student to turn to page 8: "Now, let`s turn to page 8."
      Can you read first two sentences?

  - id: "20"
    title: "page_8"
    pages: []
    plan_nl: |
      Now, can you read the remaining sentences?
      Wait for the student’s response and correct mistakes.

  - id: "21"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.

  - id: "22"
    title: "page_8"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "23"
    title: "page_10"
    pages: [10]
    plan_nl: |
      Clearly guide the student to turn to page 10: "Turn to page 10."
      I will read first. The Chinese garden is beautiful and peaceful. I'll remember it whenever I see water, rocks, and trees.

  - id: "24"
    title: "page_10"
    pages: []
    plan_nl: |
      Ask a question about the main point of the text.

  - id: "25"
    title: "page_10"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "26"
    title: "review"
    pages: []
    plan_nl: |
      Ask a question to review key vocabulary from the text.

  - id: "27"
    title: "review_retell"
    pages: [10]
    plan_nl: |
      Ask a general comprehension question about the whole text.
      Wait for the student’s response and give positive encouragement.

  - id: "28"
    title: "goodbye"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! You smiled with every page! See you next time!"

policies:
  defaults:
    step_turns: 1

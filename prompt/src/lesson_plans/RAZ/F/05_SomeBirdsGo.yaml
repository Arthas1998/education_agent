steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "Have you ever been to a zoo?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "What animals can you find near your home?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat only, then transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "Some Birds Go." We will learn why some birds migrate and how they travel."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Turn to page 3."
      I will read first, Up in the sky, birds fly by. Where are the birds going?

  - id: "8"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.

  - id: "9"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.

  - id: "10"

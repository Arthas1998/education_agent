# ============================
# Lesson Plan: RAZ/F/06_AnimalDads
# ============================
steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What did you eat for lunch?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Do you like vegetables or fruit?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat.
      Transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "Animal Dads." We will learn how some animal dads help their young."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_2"
    pages: [2]
    plan_nl: |
      Clearly guide the student to turn to page 2: "Turn to page 2."
      The teacher reads the text first: "Read aloud with me. Animal Dads. Written by Barbara Schwartz. www.readinga-z.com"

  - id: "8"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "10"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Now, let`s turn to page 3."
      The teacher reads the text first: "Read aloud with me. Some animal dads don't help much. These dads don't help at all!"

  - id: "11"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about cause and effect in the text.
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "13"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4."
      Ask the student to read the text: "Can you read this text?"

  - id: "14"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about what might happen next in the story.
      Wait for the student’s response and correct mistakes.

  - id: "15"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question linking the text to the picture/diagram.
      Wait for the student’s response and correct mistakes.

  - id: "16"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Now, let`s turn to page 5."
      The teacher reads the text first: "Read aloud with me. This dad guards and cares for his chicks. He helps them all by himself for almost two years."

  - id: "17"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question about sequence (what happens first/next).
      Wait for the student’s response and correct mistakes.

  - id: "18"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "19"
    title: "page_6"
    pages: [6]
    plan_nl: |
      Clearly guide the student to turn to page 6: "Turn to page 6."
      The teacher reads the text first: "Read aloud with me. This dad cleans bugs from his babies' fur. He helps feed them."

  - id: "20"
    title: "page_6"
    pages: []
    plan_nl: |
      After reading the first two sentences, then the teacher reads the text: "Go on reading. He carries them, too."
      Wait for the student’s response and correct mistakes.

  - id: "21"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase from the text.
      Wait for the student’s response and correct mistakes.

  - id: "22"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a question about the character's actions or their feeling.
      Wait for the student’s response and correct mistakes.

  - id: "23"
    title: "page_6"
    pages: []
    plan_nl: |
      Ask a divergent question about how your dad or family helps you.

  - id: "24"
    title: "page_7"
    pages: [7]
    plan_nl: |
      Clearly guide the student to turn to page 7: "Now, let`s turn to page 7."
      Ask the student to read the text: "Can you read this text?"

  - id: "25"

      Clearly guide the student to turn to page 9: "Now, let`s turn to page 9."
      The teacher reads the text first: "Read aloud with me. This dad carries tadpoles on his back. He helps them reach water."

  - id: "32"
    title: "page_9"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.
      Wait for the student’s response and correct mistakes.

  - id: "33"

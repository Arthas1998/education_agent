      The teacher reads the text first: "Read aloud with me. These dads help out with their young, too!"

  - id: "42"
    title: "page_12"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.
      Wait for the student’s response and correct mistakes.

  - id: "43"

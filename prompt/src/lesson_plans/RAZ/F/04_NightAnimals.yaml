# ============================
# Lesson Plan: RAZ/F/04_NightAnimals
# ============================
# Source: :contentReference[oaicite:0]{index=0}
steps:
  - id: "1"
    title: "greet_1"
    pages: []
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then ask: "What did you eat for breakfast?"

  - id: "2"
    title: "greet_1"
    pages: []
    plan_nl: |
      Briefly respond and chat with the student.
      Keep it short and encouraging.

  - id: "3"
    title: "greet_2"
    pages: []
    plan_nl: |
      Respond to the student.
      Then ask: "Do you have a pet? What is it?"

  - id: "4"
    title: "greet_2"
    pages: []
    plan_nl: |
      Briefly chat.
      Transition to the cover.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "OK, let's begin the lesson and turn to the cover page."
      Ask ONE prediction question about the cover picture.

  - id: "6"
    title: "cover"
    pages: []
    plan_nl: |
      Introduce the text: "Today we are going to read a book called "Night Animals." We will learn about animals that are active at night in the air, in water, and on land."
      Then ask: "Let's start today’s lesson, OK?"

  - id: "7"
    title: "page_2"
    pages: [2]
    plan_nl: |
      Clearly guide the student to turn to page 2: "Turn to page 2."
      The teacher reads the text first: "Read aloud with me. Night Animals. Written by Terri Patterson."

  - id: "8"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question about an important detail in the text.
      Wait for the student’s response and correct mistakes.

  - id: "9"
    title: "page_2"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "10"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Now, let`s turn to page 3."
      Ask the student to read the text: "Can you read this text?"

  - id: "11"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about sequence (what happens first/next).
      Wait for the student’s response and correct mistakes.

  - id: "12"
    title: "page_3"
    pages: []
    plan_nl: |
      Ask a question about the details of the picture.
      Wait for the student’s response and correct mistakes.

  - id: "13"
    title: "page_4"
    pages: [4]
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4."
      The teacher reads the text first: "Read aloud with me. Some animals are active at night, when it is dark. These animals sleep during the day while the Sun shines."

  - id: "14"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question to check the meaning of a key word/phrase from the text.
      Wait for the student’s response and correct mistakes.

  - id: "15"
    title: "page_4"
    pages: []
    plan_nl: |
      Ask a question about how two things in current and last pages are alike or different.
      Wait for the student’s response and correct mistakes.

  - id: "16"
    title: "page_5"
    pages: [5]
    plan_nl: |
      Clearly guide the student to turn to page 5: "Now, let`s turn to page 5."
      The teacher reads the text first: "Read aloud with me. These animals have special eyes to help them see in the dark. Most of them also hear and smell well."

  - id: "17"
    title: "page_5"
    pages: []
    plan_nl: |
      After reading the first two sentences, then the teacher reads the text: "Go on reading. Their senses help them find food at night."
      Wait for the student’s response and correct mistakes.

  - id: "18"
    title: "page_5"
    pages: []
    plan_nl: |
      Ask a question about cause and effect in the text.
      Wait for the student’s response and correct mistakes.

  - id: "19"

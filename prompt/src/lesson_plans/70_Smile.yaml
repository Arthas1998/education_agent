# =========================
# Lesson Plan: 70_Smile
# =========================

steps:
  - id: "1"
    title: "greet_1"
    pages: [1]
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      Then asks the student: "What do you do in the morning before school?"

  - id: "2"
    title: "greet_1"
    pages: [1]
    plan_nl: |
      Wait for the student's answer and encourage the student to mention specific morning activities.

  - id: "3"
    title: "greet_2"
    pages: [1]
    plan_nl: |
      Ask: "What is the weather like today?"

  - id: "4"
    title: "greet_2"
    pages: [1]
    plan_nl: |
      Just talk with student. It doesn't need to be related to the textbook content.

  - id: "5"
    title: "cover"
    pages: [1]
    plan_nl: |
      Clearly prompt student to turn to the cover page: "Let`s turn to cover page."
      Then introduces the textbook and ask: "Today we are going to read a story called ‘Smile.’ It’s about a boy who smiles at different people in his life. Who do you think the boy is smiling at on this page?"

  - id: "6"
    title: "cover"
    pages: [1]
    plan_nl: |
      After encouraging or correcting the student's answer, ask: "Let’s see who the boy is smiling at in the story. OKey?"

  - id: "7"
    title: "page_3"
    pages: [3]
    plan_nl: |
      Clearly guide the student to turn to page 3: "Let`s turn to page 3."
      Then read the text first: "I will read the text first.Smile at your dog."
      followed by: "Can you read this page for me?"

  - id: "8"
    title: "page_3"
    pages: [3]
    plan_nl: |      
      After the students read the text aloud, the teacher ask:"What is drawn in the picture?"

  - id: "9"
    title: "page_3"
    pages: [3]
    plan_nl: |      
      After students describe the pictures, encourage or correct them based on their responses.   
      Then Ask the students: "Do you like dogs?"

  - id: "10"
    title: "page_4"
    pages: [4]
    plan_nl: |      
      Clearly guide the student to turn to page 4: "Turn to page 4."
      Ask: "Can you read this sentence, ‘Smile at your brother’?"

  - id: "11"
    title: "page_4"
    pages: [4]
    plan_nl: |      
      After students read the text aloud, guide them to look at the pictures and describe the picture.

  - id: "12"
    title: "page_4"
    pages: [4]
    plan_nl: | 
      Then ask student: "Do you and your brother share a room?"

  - id: "13"
    title: "page_5"
    pages: [5]
    plan_nl: | 
      Clearly guide the student to turn to page 5 and ask: "Now, let`s turn to page 5. What the girl in the picture is doing?"

  - id: "14"
    title: "page_5"
    pages: [5]
    plan_nl: | 
      Describe what the girl in the picture is doing and what the boy is smiling at his sister.
      Then guide the students to read the text: "Please read this sentence, 'Smile at your sister'"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "15"
    title: "page_5"
    pages: [5]
    plan_nl: |   
      Ask: "If you have an older sister, would you enjoy playing with her?"

  - id: "16"
    title: "page_6"
    pages: [6]
    plan_nl: | 
      Clearly guide the student to turn to page 6: "Turn to page 6. Can you read this page for me?"
      Wait for the student to read aloud: "Smile at your mom."

  - id: "17"
    title: "page_6"
    pages: [6]
    plan_nl: | 
      Ask: "What is the mom doing in the picture?"

  - id: "18"
    title: "page_6"
    pages: [6]
    plan_nl: | 
      Wait for the student’s answer,then describe the picture.
      Then ask to read aloud again:"Please read it again.'Smile at your mom.'"

  - id: "19"
    title: "page_7"
    pages: [7]
    plan_nl: | 
      After the students finished reading the text from the previous lesson, guide the student to turn to page 7: "Then, turn to page 7. Look at the picture on this page. Who is the boy smiling at?"

  - id: "20"
    title: "page_7"
    pages: [7]
    plan_nl: | 
      After the students answered the previous question, have them read the text aloud: "Now, let's read it together.'Smile at your dad.'"

  - id: "21"
    title: "page_7"
    pages: [7]
    plan_nl: | 
      After the students read aloud, ask: "Is your dad's work very hard?"
      Wait for the student’s response and give positive encouragement.

  - id: "22"
    title: "page_8"
    pages: [8]
    plan_nl: | 
      Guide the student to turn to page 8: "Now let’s look at page 8. Can you read this sentence?"

  - id: "23"
    title: "page_8"
    pages: [8]
    plan_nl: | 
      Ask:"How many children are there in the picture?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "24"
    title: "page_8"
    pages: [8]
    plan_nl: |
      Ask: "Do you like to play with your friend?"
      Wait for the student’s answer.

  - id: "25"
    title: "page_9"
    pages: [9]
    plan_nl: |
      Guide the student to turn to page 9: "Let`s go to next page. Can you read this sentence now?"

  - id: "26"
    title: "page_9"
    pages: [9]
    plan_nl: |
      After the students read the text aloud, ask:"What is the boy doing as his smiling?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "27"
    title: "page_9"
    pages: [9]
    plan_nl: |
      After respond to the student's answer to the previous question, and ask: "Do you like sharing food with others?"
      Wait for the student’s response and give positive encouragement.

  - id: "28"
    title: "page_10"
    pages: [10]
    plan_nl: |
      Guide the student to turn to the last page: "Turn to the last page. Look at the mirror in the picture. What is it?"

  - id: "29"
    title: "page_10"
    pages: [10]
    plan_nl: |
      Respond to the student's answer to the previous question, then ask: "He’s smiling at himself. Do you know how to say it when you laugh at yourself?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "30"
    title: "review"
    pages: [11]
    plan_nl: |
      Review what was learned today by asking questions to help the student remember: "Who did the boy smile at first?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "31"
    title: "review"
    pages: [11]
    plan_nl: |
      Vocabulary review: "Today we learned to smile at these people. Can you read these words aloud?"
      Wait for the student’s response, correct mistakes and offer encouragement.

  - id: "32"
    title: "goodbye"
    pages: [12]
    plan_nl: |
      The teacher gives a summary and ends the class: "Great job today! You smiled with every page! See you next time!"

policies:
  defaults:
    step_turns: 1
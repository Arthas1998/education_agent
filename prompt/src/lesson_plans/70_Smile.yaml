# =========================
# Lesson Plan: 70_Smile
# =========================

steps:
  - id: greet_1
    title: "寒暄环节"
    pages: [9]
    plan_nl: |
      First, introduce yourself: "Hello, I am your English teacher today."
      The teacher asks the student: "What do you do in the morning before school?"
      Wait for the student's answer and encourage the student to mention specific morning activities.

  - id: greet_2
    title: "寒暄环节2"
    pages: []
    plan_nl: |
      Ask: "What is the weather like today?"
      No more words before student answers, just talk with student.

  - id: cover
    title: "标题页讲解"
    pages: []
    plan_nl: |
      Clearly prompt student to turn to the cover page.
      [CRITICAL] First, introduces the textbook: "Today we are going to read a story called ‘Smile.’ It’s about a boy who smiles at different people in his life."
      Then ask: "Let’s see who the boy is smiling at. OKey?"

  - id: page_1
    title: "Smile at your dog"
    pages: []
    plan_nl: |
      Clearly guide the student to turn to page 3: "Let`s turn to page 3."
      then read the text first: "I will read the text first."
      The teacher reads aloud: "Smile at your dog."
      followed by: "Can you read this page for me?"
      After the students read the text aloud, the teacher describes the illustration.
      Then Ask the students: "Do you like dogs?"

  - id: page_2
    title: "Smile at your brother"
    pages: []
    plan_nl: |
      Clearly guide the student to turn to page 4: "Turn to page 4. Look at the picture on this page."
      Ask: "Can you read this sentence, ‘Smile at your brother’?"
      After students read the text aloud, guide them to look at the pictures and describe the picture.
      Then ask student: "Do you and your brother share a room?"

  - id: page_3
    title: "Smile at your sister"
    pages: []
    plan_nl: |
      Clearly guide the student to turn to page 5 and ask: "Now, let`s turn to page 5. Can you read this sentence, ‘Smile at your sister’?"
      Describe what the girl in the picture is doing and what the boy is smiling at his sister,
      Then ask the student to read the text aloud: "If you have an older sister, would you enjoy playing with her?"

  - id: page_4
    title: "Smile at your mom"
    pages: []
    plan_nl: |
      Clearly guide the student to turn to page 6: "Turn to page 6. Can you read this page for me?"
      Wait for the student to read aloud: "Smile at your mom."
      Ask: "What is the mom doing in the picture?"
      Wait for the student’s answer,then describe the picture: "She is making breakfast for the boy."
      Confirm the student’s answer and extend the interaction briefly in a simple way.

  - id: page_5
    title: "Smile at your dad"
    pages: []
    plan_nl: |
      Guide the student to turn to page 7: "Then, turn to page 7. Look at the picture on this page. Who is the boy smiling at?"
      Guide the student to observe the picture, which shows the boy and his dad.
      Then Ask: "Is your dad's work very hard?"
      Wait for the student’s response and give positive encouragement.

  - id: page_6
    title: "Smile at your friend"
    pages: []
    plan_nl: |
      Guide the student to turn to page 8: "Now let’s look at page 8. I’ll read it first."
      The teacher reads aloud: "Smile at your friend."
      Then say: "Can you read this page for me?"
      After the students read aloud, describe the illustration: the boy and his friend are smiling again.
      Ask: "Do you like to play with your friend?"
      Wait for the student’s answer.

  - id: page_7
    title: "Smile at your teacher"
    pages: []
    plan_nl: |
      Guide the student to turn to page 9: "Let`s go to next page. Can you read this page now?"
      Wait for the student to read aloud: "Smile at your teacher."
      Ask: "What is the boy doing as his smiling?"
      Wait for the student’s answer, then answer: "He’s sharing his fruit with his teacher."

  - id: page_8
    title: "Smile at yourself"
    pages: []
    plan_nl: |
      Guide the student to turn to the last page: "Look at the last page. Can you read it first?"
      After the student read aloud, wait for the student’s answer and guide them to look at the mirror in the picture.
      Then ask: "He’s smiling at himself. Do you know how to say it when you laugh at yourself?"

  - id: review
    title: "课堂总结"
    pages: []
    plan_nl: |
      Review what was learned today by asking questions to help the student remember:
      "Who did the boy smile at first?"
      "Who did he smile at last?"
      Briefly review the content of each page to help the student reinforce the sentence pattern "Smile at..." and the related vocabulary for people.

  - id: goodbye
    title: "宣布下课"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class:
      "Great job today! You smiled with every page! See you next time!"
      Make sure the student feels encouraged and recognized.

  - id: after_class_summary
    title: "课后总结（教师用）"
    pages: []
    plan_nl: |
      The key sentence pattern in this lesson is “Smile at…,” and the student learned vocabulary related to family members and friends.
      You need to summarize the student’s performance and note the areas the student has not mastered well. 

policies:
  step_turns:
    greet_1: 1
    greet_2: 2
    cover: 2

    page_1: 2
    page_2: 2
    page_3: 2
    page_4: 2
    page_5: 2
    page_6: 2
    page_7: 2
    page_8: 2

    review: 2
    goodbye: 1
    after_class_summary: 1

  defaults:
    step_turns: 2
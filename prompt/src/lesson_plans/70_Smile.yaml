# =========================
# Lesson Plan: 70_Smile
# =========================

steps:
  - id: greet_1
    title: "寒暄环节"
    pages: []
    plan_nl: |
      The teacher asks the student: "What do you do in the morning before school?"
      Wait for the student's answer and encourage the student to mention specific morning activities.

  - id: greet_2
    title: "寒暄环节2"
    pages: []
    plan_nl: |
      Then ask: "What makes you smile?"
      Wait for the student's answer, and encourage the student to describe in English what makes them smile.
      Possible answers include: favorite toy, pet, family, friends, and so on.

  - id: cover
    title: "标题页讲解"
    pages: [1]
    plan_nl: |
      The teacher introduces: "Today we are going to read a story called ‘Smile.’ It’s about a boy who smiles at different people in his life."
      Guide the student to turn to the cover page and say: "Let’s see who the boy is smiling at."
      Ask: "Who do you think the boy is smiling at on this page?"
      Give feedback based on the student’s guesses and encourage them to express their ideas in English.

  - id: page_1
    title: "Smile at your dog"
    pages: [3]
    plan_nl: |
      Guide the student to turn to page 2: "Now, can you read this page?"
      Wait for the student to read aloud: "Smile at your dog."
      If needed, the teacher gives simple pronunciation correction.
      Then ask: "What do you see in the picture? Who is the boy smiling at?"
      Wait for the student’s answer: "He’s smiling at his dog!"
      Encourage the student to keep sharing their ideas and give positive feedback.

  - id: page_2
    title: "Smile at your brother"
    pages: [4]
    plan_nl: |
      Guide the student to turn to page 3: "Look at the picture on this page. Who is the boy smiling at?"
      Guide the student to observe the picture, which shows the boy and his younger brother.
      Ask: "Can you point to the boy and say, ‘Smile at your brother’?"
      Wait for the student’s response and encourage them to use the sentence pattern correctly.
      If needed, the teacher provides a model or gentle correction.

  - id: page_3
    title: "Smile at your sister"
    pages: [5]
    plan_nl: |
      Guide the student to turn to page 4: "Let’s turn to page 4. I will read it first."
      The teacher reads aloud: "Smile at your sister."
      Describe the illustration: the boy is smiling with his sister.
      Ask: "Who is the boy smiling at?"
      Wait for the student’s answer: "He’s smiling at his sister."
      Encourage the student’s answer and keep the interaction going.

  - id: page_4
    title: "Smile at your mom"
    pages: [6]
    plan_nl: |
      Guide the student to turn to page 5: "Can you read this page for me?"
      Wait for the student to read aloud: "Smile at your mom."
      Ask: "Who is the boy smiling at in the kitchen?"
      Wait for the student’s answer: "He’s smiling at his mom."
      Confirm the student’s answer and extend the interaction briefly in a simple way.

  - id: page_5
    title: "Smile at your dad"
    pages: [7]
    plan_nl: |
      Guide the student to turn to page 6: "Look at the picture on this page. Who is the boy smiling at?"
      Guide the student to observe the picture, which shows the boy and his dad.
      Ask: "Can you say ‘Smile at your dad’?"
      Wait for the student’s response and give positive encouragement.

  - id: page_6
    title: "Smile at your friend"
    pages: [8]
    plan_nl: |
      Guide the student to turn to page 7: "Now let’s look at page 7. I’ll read it first."
      The teacher reads aloud: "Smile at your friend."
      Describe the illustration: the boy and his friend are smiling again.
      Ask: "Who is the boy smiling at in this picture?"
      Wait for the student’s answer: "He’s smiling at his friend."
      Encourage the student to use a complete sentence in English again.

  - id: page_7
    title: "Smile at your teacher"
    pages: [9]
    plan_nl: |
      Guide the student to turn to page 8: "Can you read this page now?"
      Wait for the student to read aloud: "Smile at your teacher."
      Ask: "Who is the boy smiling at?"
      Wait for the student’s answer: "He’s smiling at his teacher."
      Encourage the student to participate actively and give positive feedback.

  - id: page_8
    title: "Smile at yourself"
    pages: [10]
    plan_nl: |
      Guide the student to turn to the last page: "Look at the last page. Who is the boy smiling at now?"
      Ask: "Is he smiling at someone else?"
      Wait for the student’s answer and guide them to look at the mirror in the picture.
      Summarize: "He’s smiling at himself!"
      Give the student high praise for understanding: "Great job!"

  - id: review
    title: "课堂总结"
    pages: [11]
    plan_nl: |
      Review what was learned today by asking questions to help the student remember:
      "Who did the boy smile at first?"
      "Who did he smile at last?"
      Briefly review the content of each page to help the student reinforce the sentence pattern "Smile at..." and the related vocabulary for people.

  - id: goodbye
    title: "宣布下课"
    pages: []
    plan_nl: |
      The teacher gives a summary and ends the class:
      "Great job today! You smiled with every page! See you next time!"
      Make sure the student feels encouraged and recognized.

  - id: after_class_summary
    title: "课后总结（教师用）"
    pages: []
    plan_nl: |
      The key sentence pattern in this lesson is “Smile at…,” and the student learned vocabulary related to family members and friends.
      You need to summarize the student’s performance and note the areas the student has not mastered well. 

policies:
  step_turns:
    greet_1: 1
    greet_2: 2
    cover: 2

    page_1: 2
    page_2: 2
    page_3: 2
    page_4: 2
    page_5: 2
    page_6: 2
    page_7: 2
    page_8: 2

    review: 2
    goodbye: 1
    after_class_summary: 1

  defaults:
    step_turns: 2